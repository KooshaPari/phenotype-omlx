name: CI

on:
  push:
    branches: [main, master, develop, "release/**"]
  pull_request:
    branches: [main, master, develop]
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONIOENCODING: utf-8

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_deny: ${{ steps.detect.outputs.has_deny }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_security: ${{ steps.detect.outputs.has_security }}
      has_trunk: ${{ steps.detect.outputs.has_trunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set +e
          # Initialize all outputs to false (critical: every output must be set)
          {
            echo "has_rust=false"
            echo "has_deny=false"
            echo "has_python=false"
            echo "has_go=false"
            echo "has_typescript=false"
            echo "has_security=false"
            echo "has_trunk=false"
          } >> "$GITHUB_OUTPUT"

          # Rust: discover nested workspaces, then optionally enable cargo-deny.
          if find . -name Cargo.toml -type f -not -path './target/*' -print -quit | grep -q .; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            if [ -f "deny.toml" ] || find . -name deny.toml -type f -print -quit | grep -q .; then
              echo "has_deny=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Python: needs pyproject.toml, setup.py, requirements.txt, or *.py
          if find . -maxdepth 4 \( -name pyproject.toml -o -name setup.py -o -name setup.cfg -o -name 'requirements*.txt' \) -type f -print -quit | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          # Go: needs go.mod
          if find . -name go.mod -type f -print -quit | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          fi

          # TypeScript / JS: needs package.json (with type=module or tsconfig or js files)
          if find . -name package.json -type f -print -quit | grep -q .; then
            echo "has_typescript=true" >> "$GITHUB_OUTPUT"
          fi

          # Security: always run (bandit/gitleaks/dependency-review)
          echo "has_security=true" >> "$GITHUB_OUTPUT"

          # Trunk: only if trunk.yaml exists
          if [ -f "trunk.yaml" ]; then
            echo "has_trunk=true" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Detected ==="
          echo "Detection complete; outputs were written to GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Detect changed Rust files
        id: rust-changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD -- '*.rs' > "$RUNNER_TEMP/rust-files"
          if [ -s "$RUNNER_TEMP/rust-files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Rust files changed; the dedicated perf-core workflow owns full-workspace validation."
          fi
      - name: cargo fmt --check
        if: steps.rust-changes.outputs.changed == 'true'
        run: |
          while IFS= read -r file; do
            rustfmt --check "$file"
          done < "$RUNNER_TEMP/rust-files"
      - name: cargo clippy
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo clippy --manifest-path perf-core/Cargo.toml --workspace --all-targets --exclude turbo-quant-mojo --exclude concurrent-exec-cuda -- -D warnings
      - name: cargo build
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo build --manifest-path perf-core/Cargo.toml --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda
      - name: cargo test
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo test --manifest-path perf-core/Cargo.toml --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda --no-fail-fast

  cargo-deny:
    name: Cargo Deny (Advisories + Licenses)
    needs: detect
    if: needs.detect.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --all-features

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect changed Python files
        id: python-changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD -- '*.py' > "$RUNNER_TEMP/python-files"
          if [ -s "$RUNNER_TEMP/python-files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Python files changed; source-wide Ruff debt is tracked outside this governance change."
          fi
      - name: Install ruff
        if: steps.python-changes.outputs.changed == 'true'
        run: python -m pip install --quiet ruff
      - name: ruff check
        if: steps.python-changes.outputs.changed == 'true'
        run: |
          while IFS= read -r file; do
            ruff check "$file"
          done < "$RUNNER_TEMP/python-files"
      - name: ruff format --check
        if: steps.python-changes.outputs.changed == 'true'
        run: |
          while IFS= read -r file; do
            ruff format --check "$file"
          done < "$RUNNER_TEMP/python-files"
      - name: install project dependencies
        if: steps.python-changes.outputs.changed == 'true'
        run: python -m pip install --quiet -e python
      - name: pytest
        if: steps.python-changes.outputs.changed == 'true'
        run: |
          mapfile -t tests < <(grep -E '(^|/)test_[^/]+\.py$|(^|/)tests/' "$RUNNER_TEMP/python-files" || true)
          if [ "${#tests[@]}" -gt 0 ]; then
            python -m pytest --no-header -q "${tests[@]}"
          else
            echo "No changed Python tests found"
          fi

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Detect changed Go files
        id: go-changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD -- '*.go' > "$RUNNER_TEMP/go-files"
          if [ -s "$RUNNER_TEMP/go-files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Go files changed; module-wide checks are not required for this governance change."
          fi
      - name: gofmt check
        if: steps.go-changes.outputs.changed == 'true'
        run: |
          failed=0
          while IFS= read -r file; do
            if [ -n "$(gofmt -l "$file")" ]; then
              echo "$file"
              failed=1
            fi
          done < "$RUNNER_TEMP/go-files"
          exit "$failed"
      - name: go vet and test
        if: steps.go-changes.outputs.changed == 'true'
        run: |
          mapfile -t modules < <(find . -name go.mod -type f -print0 | xargs -0 -n1 dirname | sort -u)
          for dir in "${modules[@]}"; do
            (cd "$dir" && go vet ./... && go test ./...)
          done

  typescript:
    name: TS/JS
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect changed JavaScript files
        id: js-changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' 'package.json' > "$RUNNER_TEMP/js-files"
          if [ -s "$RUNNER_TEMP/js-files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No JavaScript/TypeScript files changed; package-specific checks are skipped."
          fi
      - name: install package dependencies
        if: steps.js-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            dir="$(dirname "$package")"
            if [ -f "$dir/package-lock.json" ]; then
              npm ci --prefix "$dir" --no-audit --no-fund
            else
              npm install --prefix "$dir" --no-audit --no-fund
            fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -print)
      - name: lint
        if: steps.js-changes.outputs.changed == 'true'
        run: |
          while IFS= read -r package; do
            dir="$(dirname "$package")"
            if grep -q '"lint"' "$package"; then (cd "$dir" && npm run lint); fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -print)
      - name: test
        if: steps.js-changes.outputs.changed == 'true'
        run: |
          while IFS= read -r package; do
            dir="$(dirname "$package")"
            if grep -q '"test"' "$package"; then (cd "$dir" && npm test); fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -print)

  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.has_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  lint:
    name: ci / lint
    if: always()
    needs:
      [detect, rust, cargo-deny, python, go, typescript, security, dep-review]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate lint gate
        run: |
          failed=0
          for pair in \
            "rust:${{ needs.rust.result }}" \
            "cargo-deny:${{ needs['cargo-deny'].result }}" \
            "python:${{ needs.python.result }}" \
            "go:${{ needs.go.result }}" \
            "typescript:${{ needs.typescript.result }}" \
            "security:${{ needs.security.result }}" \
            "dep-review:${{ needs['dep-review'].result }}" \
            ; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            elif [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result"
            else
              echo "  ? $name: $result"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed lint check(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All lint checks passed (or were skipped)"

  test:
    name: ci / test
    if: always()
    needs: [detect, rust, cargo-deny, python, go, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: Test gate
        run: |
          for pair in \
            "detect:${{ needs.detect.result }}" \
            "rust:${{ needs.rust.result }}" \
            "cargo-deny:${{ needs['cargo-deny'].result }}" \
            "python:${{ needs.python.result }}" \
            "go:${{ needs.go.result }}" \
            "typescript:${{ needs.typescript.result }}"; do
            status="${pair#*:}"
            if [ "$status" != success ] && [ "$status" != skipped ]; then
              echo "$pair" >&2
              exit 1
            fi
          done
          echo "✅ All test stages passed"
