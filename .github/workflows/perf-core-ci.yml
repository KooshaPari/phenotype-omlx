name: perf-core CI

on:
  push:
    branches: [main]
    paths:
      - "perf-core/**"
  pull_request:
    branches: [main]
    paths:
      - "perf-core/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      format_base_ref:
        description: "Optional base branch for changed-Rust formatting (for example, feat/diffusion-trajectory-state)"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: brew install zig

      - name: Install Zig (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ZIG_VERSION="0.14.1"
          ZIG_ARCHIVE="/tmp/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "${ZIG_ARCHIVE}"
          sudo mkdir -p /opt/zig
          sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm "${ZIG_ARCHIVE}"

      - name: Verify Zig
        run: zig version

      - name: Verify Nim
        if: runner.os == 'macOS'
        run: nim --version || brew install nim

      - name: Verify Nim (Ubuntu)
        if: runner.os == 'Linux'
        run: nim --version || { curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y && echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"; }

      - name: cargo check (exclude mojo + cuda)
        working-directory: perf-core
        run: cargo check --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: brew install zig

      - name: Install Zig (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ZIG_VERSION="0.14.1"
          ZIG_ARCHIVE="/tmp/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "${ZIG_ARCHIVE}"
          sudo mkdir -p /opt/zig
          sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm "${ZIG_ARCHIVE}"

      - name: Verify Zig
        run: zig version

      - name: Verify Nim
        if: runner.os == 'macOS'
        run: nim --version || brew install nim

      - name: Verify Nim (Ubuntu)
        if: runner.os == 'Linux'
        run: nim --version || { curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y && echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"; }

      - name: cargo test (exclude mojo + cuda)
        working-directory: perf-core
        run: cargo test --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: brew install zig

      - name: Install Zig (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ZIG_VERSION="0.14.1"
          ZIG_ARCHIVE="/tmp/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "${ZIG_ARCHIVE}"
          sudo mkdir -p /opt/zig
          sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm "${ZIG_ARCHIVE}"

      - name: Verify Zig
        run: zig version

      - name: Verify Nim
        if: runner.os == 'macOS'
        run: nim --version || brew install nim

      - name: Verify Nim (Ubuntu)
        if: runner.os == 'Linux'
        run: nim --version || { curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y && echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"; }

      - name: cargo clippy (exclude mojo + cuda)
        working-directory: perf-core
        run: cargo clippy --workspace --all-targets --exclude turbo-quant-mojo --exclude concurrent-exec-cuda -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: perf-core
        env:
          # Pull requests and merge queues provide a base ref. Manual dispatch
          # may opt into one; otherwise use the event's previous commit (or
          # HEAD^), never origin/main, so unrelated baseline drift is excluded.
          FORMAT_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.inputs.format_base_ref || '' }}
        run: |
          set -euo pipefail
          if [ -n "${FORMAT_BASE_REF}" ]; then
            base_ref="${FORMAT_BASE_REF}"
            case "$base_ref" in
              refs/heads/*) base_ref="${base_ref#refs/heads/}" ;;
            esac
            if ! git show-ref --verify --quiet "refs/remotes/origin/${base_ref}"; then
              git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
            fi
            diff_range="origin/${base_ref}...HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${GITHUB_EVENT_BEFORE}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          changed=$(git diff --name-only "$diff_range" -- '*.rs')
          if [ -z "$changed" ]; then
            echo "No Rust files changed; format gate is clean."
            exit 0
          fi
          printf '%s\n' "$changed" | while IFS= read -r file; do
            rustfmt --edition 2021 --check "../$file"
          done

  # ---------- Windows (experimental) ----------
  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check (exclude mojo + cuda)
        working-directory: perf-core
        run: cargo check --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda

      - name: cargo test (exclude mojo + cuda)
        working-directory: perf-core
        run: cargo test --workspace --exclude turbo-quant-mojo --exclude concurrent-exec-cuda

  # ---------- Platform-specific optional jobs ----------
  # turbo-quant-zig is a workspace member, but its native ABI is opt-in via
  # the `zig` feature. Keep native and no-Zig paths explicit so a green job
  # cannot silently mean that the ABI tests were cfg-disabled.
  # NOTE: Mojo SDK is not installable on GitHub Actions runners.
  # turbo-quant-mojo is excluded from all workspace commands above.
  # NOTE: CUDA tests are skipped — concurrent-exec-cuda requires NVIDIA
  # hardware and the `cuda` feature flag, neither available on standard
  # GitHub Actions runners.

  zig-crate-native:
    # Preserve the existing required check context while making the feature
    # explicit in the command below.
    name: Zig crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-zig-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zig-

      - name: Install Zig (macOS)
        if: runner.os == 'macOS'
        run: brew install zig

      - name: Install Zig (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ZIG_VERSION="0.14.1"
          ZIG_ARCHIVE="/tmp/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "${ZIG_ARCHIVE}"
          sudo mkdir -p /opt/zig
          sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm "${ZIG_ARCHIVE}"

      - name: Verify Zig
        run: zig version

      - name: cargo check -p turbo-quant-zig (native ABI)
        working-directory: perf-core
        run: cargo check --locked --manifest-path turbo-quant-zig/Cargo.toml --features zig

      - name: cargo test -p turbo-quant-zig (native ABI)
        working-directory: perf-core
        run: cargo test --locked --manifest-path turbo-quant-zig/Cargo.toml --features zig

  zig-crate-no-zig:
    name: Zig crate no-Zig fallback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            perf-core/target
          key: ${{ runner.os }}-cargo-zig-no-toolchain-${{ hashFiles('perf-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zig-no-toolchain-

      - name: cargo check -p turbo-quant-zig (no-Zig fallback)
        working-directory: perf-core
        env:
          TURBO_QUANT_ZIG_SKIP: "1"
        run: cargo check --locked --manifest-path turbo-quant-zig/Cargo.toml --features zig

      - name: cargo test -p turbo-quant-zig (no-Zig fallback)
        working-directory: perf-core
        env:
          TURBO_QUANT_ZIG_SKIP: "1"
        run: cargo test --locked --manifest-path turbo-quant-zig/Cargo.toml --features zig
