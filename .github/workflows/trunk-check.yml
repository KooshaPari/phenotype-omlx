# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  merge_group:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location \
            "${release_url}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" -version

      - name: Install Prettier
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --version

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3  # v1.3.1
        with:
          post-init: trunk install

      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3  # v1.3.1
        with:
          trunk-args: --upgrade
