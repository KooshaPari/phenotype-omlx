# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Historically ran trunk-io/trunk-action to coordinate prettier, actionlint,
# ruff, mypy, clippy, golangci-lint, shellcheck, eslint, etc. However:
#
#   1. trunk-io/trunk-action@1.3.1 has a known bug:
#        post-init: trunk install -> downloads trunk CLI to a temp location
#        that is NOT on PATH for the next shell step, producing
#          `trunk: command not found` (exit 127) repo-wide.
#   2. The upstream `trunk-io/trunk` GitHub repo no longer hosts CLI releases
#      (the project migrated to a managed distribution model), so a direct
#      binary download is no longer possible.
#   3. The repo's `ci / lint` + `ci / test` jobs (ci.yml) already run ruff,
#      mypy, clippy, golangci-lint, cargo fmt, etc. independently — so dropping
#      the trunk layer does not lose coverage.
#
# This workflow now does the two checks that trunk was uniquely responsible for
# and that the rest of CI does NOT cover:
#   - prettier on the entire repo
#   - actionlint on .github/workflows/*.yml
#
# Both use pinned, deterministic installs. No third-party orchestrator.
# =============================================================================

name: Trunk Check

on:
  pull_request:
  merge_group:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location \
            "${release_url}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" -version

      - name: Install Prettier
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --version

      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color

      - name: prettier check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "No comparison base for a scheduled run; actionlint completed above."
            exit 0
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base_ref="${{ github.event.merge_group.base_sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          git fetch --no-tags --depth=1 origin "$base_ref"
          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only FETCH_HEAD HEAD -- \
              '*.md' '*.yml' '*.yaml' '*.json' '*.jsonc' '*.mdx'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed Prettier-supported files to check."
            exit 0
          fi
          if ! prettier --check "${files[@]}" --ignore-path .gitignore; then
            echo "::error::prettier --check failed on changed files; run prettier --write"
            exit 1
          fi
