version = "1.0"

[task]
name = "omlx/niah-api-smoke"
authors = []
keywords = ["omlx", "niah", "qwen3.5"]

[metadata]
author_name = "Phenotype"
difficulty = "easy"
category = "eval"
tags = ["niah", "qwen35", "openai-compat"]

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 180.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[agent.env]
# Host MLX / omlx OpenAI-compatible server — required at run time
OPENAI_BASE_URL = "${OPENAI_BASE_URL}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-omlx}"
OPENAI_MODEL = "${OPENAI_MODEL}"
OMLX_READY_MODEL = "${OMLX_READY_MODEL}"
