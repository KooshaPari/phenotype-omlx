# Harbor JobConfig — OMLX NIAH via Docker (host.docker.internal → host MLX)
# 32k context variant. Uses the same Qwen3.5-0.8B-OptiQ-4bit model served on
# http://127.0.0.1:8081/v1 as niah-qwen35-local.yaml, with NIAH_CONTEXT_TOKENS=32768.
# All secrets sourced from Infisical via `source ~/.config/phenotype/portage.env`.

jobs_dir: jobs/omlx-niah-local-32k
n_attempts: 1
timeout_multiplier: 1.0

# Top-level orchestrator fields (deprecated nested 'orchestrator:' key)
n_concurrent_trials: 1
quiet: false

# Top-level retry fields (fork-clean extension)
retry:
  max_retries: 0
  delay_sec: 0

environment:
  type: docker
  force_build: true
  delete: true
  cpu_enforcement_policy: auto
  memory_enforcement_policy: auto
  env:
    # The container reaches the host's MLX server via host.docker.internal.
    # Port 8081 is the local mlx_lm.server bound to 0.0.0.0.
    OPENAI_BASE_URL: "http://host.docker.internal:8081/v1"
    OPENAI_API_KEY: "omlx-local"
    OPENAI_MODEL: "mlx-community/Qwen3.5-0.8B-OptiQ-4bit"
    OMLX_READY_MODEL: "mlx-community/Qwen3.5-0.8B-OptiQ-4bit"
    # 32k context — exercises the long-context branch of build_prompt().
    # NIAH_CONTEXT_TOKENS_OVERRIDE wins over the host Infisical default
    # (NIAH_CONTEXT_TOKENS=8192) without polluting the host env.
    NIAH_CONTEXT_TOKENS_OVERRIDE: "32768"
  extra_allowed_hosts:
    - host.docker.internal

agents:
  - name: oracle

verifier:
  disable: false

datasets:
  - path: evals/harbor/tasks
    task_names:
      - omlx-niah-32k-api-smoke
