[plugin]
name        = "latentmas"
kind        = "strategy"
module      = "omlx_research.agents.latentmas_runner"
description = "LatentMAS — multi-agent collaboration in latent space. Wraps any compatible backend; fans out N latent agents, merges outputs."
version     = "0.3"
runtime     = "pytorch"
priority    = 100
requires    = ["torch", "transformers"]

# STRATEGY (not backend) — flippable option, runs across multiple backends in parallel.
# Use this when: you want N=3-5 agents to think about the prompt in parallel
# and merge their hidden states. Each agent is a separate backend invocation.
phases = ["draft", "verify", "merge"]
compatible_backends = ["mlx_metal", "sglang", "vllm", "tensorrt", "llamacpp"]
default_pool        = ["mlx_metal", "sglang"]   # run these in parallel
parallel            = true                       # all phases can be fanned out
n_agents            = 5
agent_role          = "collaborative_latent_reasoning"
merging             = "weighted_average"