[plugin]
name        = "vllm"
kind        = "backend"
module      = "omlx_research.backends.vllm_backend"
description = "vLLM — PagedAttention + continuous batching.  High-throughput NVIDIA inference."
version     = "0.6"
runtime     = "vllm"
priority    = 20
requires    = ["vllm>=0.6", "torch>=2"]

# Backend (not strategy) — leaf plugin that serves models.
# Use this for: NVIDIA multi-GPU serving, PagedAttention memory efficiency,
# high batch sizes, OpenAI-compatible API.
accelerator = "cuda"
precision   = "fp16,bf16,4bit,8bit,gptq,awq"
kv_cache    = "fp16,q4,q8"
memory_efficient = true
best_for    = ["nvidia_serving", "paged_attention", "high_batch", "openai_api"]