[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-research"
version = "0.1.0"
description = "phenotype-omlx research stack: MLX, TurboQuant+, SSD, JetSpec, LatentMAS, TiDAR"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.31",
    # 0.31.3 initializes a thread-local MLX stream in the HTTP server's
    # generation worker. Earlier releases can crash Harbor/NIAH requests with
    # `There is no Stream(gpu, 0) in current thread`.
    "mlx-lm>=0.31.3",
    "transformers>=4.40",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
metal = []
mps = ["torch>=2.2"]
cuda = ["torch>=2.2", "vllm", "sglang", "tensorrt-llm"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pydantic>=2.0"]

[project.scripts]
omlx-research = "omlx_research.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omlx_research*"]
