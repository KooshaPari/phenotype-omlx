[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "omlx-research"
version = "0.1.0"
description = "phenotype-omlx research stack: MLX, TurboQuant+, SSD, JetSpec, LatentMAS, TiDAR"
requires-python = ">=3.14"
dependencies = [
    "mlx>=0.31",
    "mlx-lm>=0.30",
    "transformers>=4.40",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
metal = []
mps = ["torch>=2.2"]
cuda = ["torch>=2.2", "vllm", "sglang", "tensorrt-llm"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
omlx-research = "omlx_research.cli:main"

[tool.maturin]
manifest-path = "ffi/Cargo.toml"
module-name = "omlx_research._perf"
python-source = "."
# Maturin defaults to stripping release libraries. Disable that default until
# the supported Rust toolchain supplies a working rust-objcopy/libLLVM pair;
# release verification must stay warning-free rather than silently shipping an
# artifact whose requested strip step failed.
strip = false
