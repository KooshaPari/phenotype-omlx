[package]
name = "turbo-quant-mojo"
version = "0.1.0"
edition = "2021"
description = "phenotype-omlx turbo-quant in Mojo (cross-language FFI polyglot crate)"

[lib]
name = "turbo_quant_mojo"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"

[features]
default = []
# Opt-in: compile + link the Mojo kernel. Requires `mojo` in PATH
# (install with: modular install mojo).
mojo = []

[build-dependencies]
