[package]
name = "turbo-quant-mojo"
version = "0.1.0"
edition = "2021"
description = "phenotype-omlx turbo-quant in Mojo (cross-language FFI polyglot crate)"

[lib]
name = "turbo_quant_mojo"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"

[features]
# Native Mojo is opt-in. The workspace depends on this crate for its portable
# fail-closed Rust implementation; enabling native linkage without a matching
# artifact is what previously caused unresolved tq_mojo_* symbols in CI.
default = []
# Marker retained for callers that need to describe a Mojo build. Native code
# is enabled only by `mojo-native`, which also requires this marker.
mojo = []
# Compile + link the Mojo kernel. Requires the SDK and a target-appropriate
# shared library/import library beside this manifest.
mojo-native = ["mojo"]
# Enable Mojo GEMV FFI path (falls back to Rust on panic or missing symbol).
mojo-ffi = ["mojo-native"]

[build-dependencies]
