[workspace]
resolver = "2"
members = [
    "spec-decode",
    "concurrent-exec",
    "turbo-quant",
    "tree-attention",
    "fleet-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
async-trait = "0.1"
dashmap = "6"
metal = "0.27"
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
