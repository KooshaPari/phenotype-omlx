[package]
name = "model-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model-family kernel packages: attention, MoE, recurrent, diffusion, and quantization primitives with scalar oracles and Rust kernels."

[lib]
name = "model_kernels"
path = "src/lib.rs"

[[bench]]
name = "moe_bench"
harness = false

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tree-attention = { path = "../tree-attention" }
libc = "0.2"
