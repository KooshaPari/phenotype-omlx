[package]
name = "fleet-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JSON-RPC server + heartbeat bridge for federated omlx/hwLedger"

[[bin]]
name = "fleet-rpc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-nats = "0.39"
bytes = "1"
clap = { version = "4", features = ["derive"] }
fleet-proto = { path = "../fleet-proto" }
pheno-capacity = { path = "../pheno-capacity" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
