[package]
name = "eval-harness"
version = "0.1.0"
edition = "2021"
description = "MMLU/GPQA/terminal-bench quality eval harness for TurboQuant+"

[lib]
name = "eval_harness"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
csv = "1"
pyo3 = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
